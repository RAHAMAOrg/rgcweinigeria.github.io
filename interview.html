<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RAHAMA Interview Scoresheet</title>
<link rel="icon" type="image/png" href="RAHAMA%20Empowerment%20Logo%20Design%20(3).png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --green:#285B3C; --green-dark:#1B3F29; --gold:#C9A227; --mist:#F0F7F2;
  --ink:#1F2A24; --ink-soft:#4F5E55; --paper:#FFFFFF; --line:#D6E3DA; --amber:#B45309; --red:#B91C1C;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:"Montserrat","Open Sans",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column}
.brand{background:var(--paper);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.brand-row{max-width:820px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand img{height:48px;width:auto}
.brand .name{font-family:var(--head);font-weight:700;font-size:1.1rem;color:var(--green);line-height:1.2}
.brand .org{font-size:.78rem;color:var(--ink-soft)}
.wrap{max-width:820px;width:100%;margin:0 auto;padding:22px 16px 40px;flex:1}
h1{font-family:var(--head);font-weight:700;font-size:1.45rem;line-height:1.25;margin:0 0 10px;color:var(--green-dark)}
h2{font-family:var(--head);font-size:1.02rem;margin:20px 0 8px}
p{margin:0 0 10px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
.muted{color:var(--ink-soft)}
button{font:inherit;font-family:var(--head);font-weight:600;border-radius:6px;padding:10px 18px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff;min-height:44px}
button:hover{background:var(--green-dark)}
button.secondary{background:var(--paper);color:var(--green)}
button.secondary:hover{background:var(--mist)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:36px;padding:6px 12px;font-size:.9rem;background:var(--paper);color:var(--green)}
.tabs button.on{background:var(--green);color:#fff}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;font-family:var(--sans);font-weight:600}
.cand:hover{border-color:var(--green);background:var(--mist)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.none{background:#EEF2EF;color:var(--ink-soft)}.pill.draft{background:#FFF1D6;color:var(--amber)}.pill.done{background:#DCEBE0;color:var(--green-dark)}
.crit{border-top:1px solid var(--line);padding:14px 0}.crit:first-of-type{border-top:none}
.crit .t{font-family:var(--head);font-weight:600}
.crit .w{font-size:.85rem;color:var(--ink-soft)}
.scale{display:flex;gap:6px;margin:8px 0}
.scale button{flex:1;min-height:44px;padding:4px;background:var(--paper);color:var(--ink);border:1px solid var(--line);font-size:1.05rem}
.scale button small{display:block;font-size:.62rem;font-family:var(--sans);font-weight:400;color:var(--ink-soft);line-height:1.1}
.scale button.on{background:var(--green);color:#fff;border-color:var(--green)}.scale button.on small{color:#DCEBE0}
.scale button:disabled{opacity:1;cursor:default}
.total{position:sticky;top:0;z-index:5;background:var(--green-dark);color:#fff;border-radius:8px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.total b{font-family:var(--head);font-size:1.3rem}
.rec label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer}
.rec input{width:20px;height:20px;accent-color:var(--green)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.error{border-left:4px solid var(--red);background:#FDECEC;padding:10px 14px;margin-top:10px}
.okbox{border-left:4px solid var(--green);background:#E8F3EC;padding:10px 14px;margin-bottom:12px}
.savestate{font-size:.85rem;opacity:.9}
details summary{cursor:pointer;color:var(--green);font-weight:600}
table.guide{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:8px}table.guide td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
footer{background:var(--green-dark);color:#DCEBE0;font-size:.85rem;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:820px;margin:0 auto}
@media (max-width:480px){.panel{padding:16px}.scale button small{display:none}}
</style>
</head>
<body>
<div class="brand"><div class="brand-row">
  <img src="RAHAMA%20Empowerment%20Logo%20Design%20(3).png" alt="RAHAMA logo">
  <div style="flex:1"><div class="name">Interview Scoresheet</div><div class="org">RAHAMA Girl Child &amp; Women Empowerment Initiative</div></div>
  <div id="who" style="font-size:.85rem;text-align:right"></div>
</div></div>
<main class="wrap" id="app"><div class="panel"><p class="muted">Loading…</p></div></main>
<footer><div class="in"><p style="margin:0">Your scores are private: other panel members cannot see them. Only RAHAMA's recruitment team sees the combined results.</p></div></footer>

<script>
/* ===== CONFIG ===== */
const CONFIG = {
  SUPABASE_URL: "https://wdondphcmnhdslcypeya.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkb25kcGhjbW5oZHNsY3lwZXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5MDA3MDcsImV4cCI6MjA4NDQ3NjcwN30.wIisWHb3w4cSGZIB4f3q0Z6lboidH6SzL7oGToGdnsw"
};
/* ================== */
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const LABELS = ["", "Poor", "Below average", "Meets expectations", "Good", "Excellent"];
const RECS = [["strongly_recommend", "Strongly recommend"], ["recommend", "Recommend"], ["do_not_recommend", "Do not recommend"]];
const P = { data: null, pos: null, cur: null, sheet: null, dirty: false, timer: null };

function fail(msg) { app.innerHTML = `<div class="panel"><h1>We couldn't open your scoresheet</h1><p>${esc(msg)}</p></div>`; }
const critFor = pos => P.data.criteria.filter(k => k.position === pos);
function pct(scores, crit) {   // weighted total out of 100, as in the RAHAMA scoresheet: (score/5) x weight
  const wsum = crit.reduce((s, k) => s + Number(k.weight), 0) || 100;
  const got = crit.reduce((s, k) => s + (scores[k.id] ? scores[k.id] / 5 * Number(k.weight) : 0), 0);
  return Math.round(got / wsum * 1000) / 10;
}
const statusOf = c => !c.mine ? ["none", "Not scored"] : c.mine.submitted_at ? ["done", "Submitted"] : ["draft", "Draft saved"];

/* ---------- Sign in: Staff Portal email and password ---------- */
function signIn(message) {
  P.data = null; $("who").innerHTML = "";
  app.innerHTML = `<div class="panel" style="max-width:440px;margin:0 auto">
    <h1>Panel sign-in</h1>
    <p>Sign in with your <strong>RAHAMA Staff Portal</strong> email and password.</p>
    <form id="sf" novalidate>
      <label style="display:block;font-weight:600;margin:12px 0 6px" for="em">Email address</label><input id="em" type="email" autocomplete="username" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px">
      <label style="display:block;font-weight:600;margin:12px 0 6px" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px">
      <div style="margin-top:16px"><button type="submit" id="sbtn">Sign in</button></div>
      <div id="smsg" role="alert">${message ? `<div class="error">${esc(message)}</div>` : ""}</div>
    </form>
    <p class="muted" style="margin-top:14px;font-size:.9rem">Forgotten your password? Reset it the usual way for the Staff Portal, or ask the recruitment team.</p></div>`;
  $("sf").onsubmit = async e => {
    e.preventDefault(); const b = $("sbtn"); b.disabled = true; b.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
    b.disabled = false; b.textContent = "Sign in";
    if (error) { $("smsg").innerHTML = `<div class="error">${/invalid/i.test(error.message) ? "Wrong email or password." : "Could not sign in. Check your connection and try again."}</div>`; return; }
    start();
  };
}
async function signOut() { await sb.auth.signOut(); signIn(); }
async function start() {
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) return signIn();
  if (!(await load())) return;
  $("who").innerHTML = `<span>${esc(P.data.panelist.name)}</span> <button class="secondary" id="out" style="min-height:32px;padding:4px 12px;font-size:.85rem">Sign out</button>`;
  $("out").onclick = signOut;
  home();
}

async function load() {
  const { data, error } = await sb.rpc("asmt_iv_panel");
  if (error) {
    const m = error.message || "";
    if (m.includes("not_a_panelist")) { await sb.auth.signOut(); signIn("Your account is not on the interview panel, or has been switched off. Please contact RAHAMA's recruitment team."); return false; }
    if (/JWT|expired|401/i.test(m)) { await sb.auth.signOut(); signIn("Your session has ended. Please sign in again."); return false; }
    fail("The portal could not be reached. Check your internet connection and reload the page."); return false;
  }
  P.data = data;
  if (!P.pos || !data.positions.some(p => p.code === P.pos)) P.pos = data.positions[0] ? data.positions[0].code : null;
  return true;
}

function home(note) {
  const d = P.data;
  if (!d.positions.length) { app.innerHTML = `<div class="panel"><h1>Hello ${esc(d.panelist.name)}</h1><p>No candidates have been added for interview yet. Please check back later.</p></div>`; return; }
  const list = d.candidates.filter(c => c.position === P.pos), crit = critFor(P.pos);
  const done = list.filter(c => c.mine && c.mine.submitted_at).length;
  app.innerHTML = `${note ? `<div class="okbox">${esc(note)}</div>` : ""}<div class="panel">
    <h1>Hello ${esc(d.panelist.name)}</h1>
    <p>Choose a candidate to score. You have submitted <strong>${done} of ${list.length}</strong> for this position.</p>
    ${d.positions.length > 1 ? `<div class="tabs">${d.positions.map(p => `<button data-pos="${esc(p.code)}" class="${p.code === P.pos ? "on" : ""}">${esc(p.title)}</button>`).join("")}</div>` : `<p class="muted">${esc(d.positions[0].title)}</p>`}
    ${!crit.length ? `<div class="error">The scoresheet for this position has not been set up yet. Please contact RAHAMA.</div>` : ""}
    ${list.map(c => { const [k, l] = statusOf(c); return `<button class="cand" data-c="${c.id}"><span>${esc(c.full_name)}</span><span>${c.mine && Object.keys(c.mine.scores || {}).length ? `<span class="muted" style="font-weight:400;margin-right:8px">${pct(c.mine.scores, crit)}%</span>` : ""}<span class="pill ${k}">${l}</span></span></button>`; }).join("")}
    <div style="margin-top:12px"><button class="secondary" id="refresh">Refresh list</button></div></div>`;
  app.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => { P.pos = b.dataset.pos; home(); });
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { if (crit.length) sheet(b.dataset.c); });
  $("refresh").onclick = async () => { if (await load()) home(); };
  window.scrollTo(0, 0);
}

function sheet(id) {
  const c = P.data.candidates.find(x => x.id === id), crit = critFor(c.position), m = c.mine || {};
  const locked = !!m.submitted_at;
  P.cur = c; P.dirty = false;
  P.sheet = { scores: { ...(m.scores || {}) }, comments: { ...(m.comments || {}) }, rec: m.recommendation || null, fee: m.proposed_fee || "", pay: m.payment_structure || "", overall: m.overall_comment || "" };
  const S = P.sheet;
  app.innerHTML = `
    <div class="total"><span>${esc(c.full_name)}</span><span><b id="tot">${pct(S.scores, crit)}%</b> <span class="savestate" id="ss">${locked ? "Submitted" : m.updated_at ? "Draft saved" : ""}</span></span></div>
    ${locked ? `<div class="okbox">You submitted this scoresheet on ${esc(new Date(m.submitted_at).toLocaleString())}. It can no longer be changed. If you need to correct it, ask RAHAMA's recruitment team to reopen it.</div>` : ""}
    <div class="panel">
      <details><summary>Rating scale</summary><table class="guide">
        <tr><td><b>1</b></td><td>Poor: little or no relevant knowledge or experience; does not meet the requirement.</td></tr>
        <tr><td><b>2</b></td><td>Below average: partial or unclear; falls short of what the role requires.</td></tr>
        <tr><td><b>3</b></td><td>Meets expectations: adequate, relevant knowledge and experience.</td></tr>
        <tr><td><b>4</b></td><td>Good: strong, well reasoned, shows practical experience.</td></tr>
        <tr><td><b>5</b></td><td>Excellent: exceptional; deep expertise and clear practical judgement.</td></tr></table></details>
      ${crit.map(k => `<div class="crit">
        <div class="t">${esc(k.name)}</div><div class="w">${k.related ? esc(k.related) + " · " : ""}Weight ${Number(k.weight)}%</div>
        <div class="scale" role="radiogroup" aria-label="${esc(k.name)} score">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-k="${k.id}" data-n="${n}" class="${S.scores[k.id] === n ? "on" : ""}" ${locked ? "disabled" : ""} aria-pressed="${S.scores[k.id] === n}">${n}<small>${LABELS[n]}</small></button>`).join("")}</div>
        <input type="text" data-cm="${k.id}" placeholder="Comment (optional)" value="${esc(S.comments[k.id] || "")}" ${locked ? "disabled" : ""}></div>`).join("")}
    </div>
    <div class="panel">
      <h2 style="margin-top:0">Overall recommendation</h2>
      <div class="rec">${RECS.map(([v, l]) => `<label><input type="radio" name="rec" value="${v}" ${S.rec === v ? "checked" : ""} ${locked ? "disabled" : ""}> ${l}</label>`).join("")}</div>
      <h2>Proposed fee or salary discussed</h2><input type="text" id="fee" value="${esc(S.fee)}" ${locked ? "disabled" : ""} placeholder="e.g. ₦450,000 per month">
      <h2>Preferred payment structure</h2><input type="text" id="pay" value="${esc(S.pay)}" ${locked ? "disabled" : ""} placeholder="e.g. Monthly, on deliverables">
      <h2>Additional comments</h2><textarea id="ov" ${locked ? "disabled" : ""}>${esc(S.overall)}</textarea>
      <div id="err" role="alert"></div>
      <div class="nav"><button class="secondary" id="back">Back to candidates</button>
        ${locked ? "" : `<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="secondary" id="draft">Save draft</button><button id="submit">Submit scores</button></span>`}</div>
    </div>`;
  const touched = () => { P.dirty = true; $("err").innerHTML = ""; $("ss").textContent = "Not saved yet"; $("tot").textContent = pct(S.scores, crit) + "%"; clearTimeout(P.timer); P.timer = setTimeout(() => save(false, true), 2500); };
  if (!locked) {
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      S.scores[b.dataset.k] = Number(b.dataset.n);
      app.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
      touched();
    });
    app.querySelectorAll("[data-cm]").forEach(i => i.oninput = () => { S.comments[i.dataset.cm] = i.value; touched(); });
    app.querySelectorAll('input[name="rec"]').forEach(r => r.onchange = () => { S.rec = r.value; touched(); });
    $("fee").oninput = e => { S.fee = e.target.value; touched(); };
    $("pay").oninput = e => { S.pay = e.target.value; touched(); };
    $("ov").oninput = e => { S.overall = e.target.value; touched(); };
    $("draft").onclick = () => save(false);
    $("submit").onclick = () => {
      const missing = crit.filter(k => !S.scores[k.id]);
      if (missing.length) return showErr(`Score every category before submitting. Missing: ${missing.map(k => k.name).join(", ")}.`);
      if (!S.rec) return showErr("Choose an overall recommendation before submitting.");
      if (!confirm(`Submit your scores for ${c.full_name}? Total ${pct(S.scores, crit)}%. You won't be able to change them afterwards.`)) return;
      save(true);
    };
  }
  $("back").onclick = async () => { if (P.dirty && !locked) await save(false, true); if (await load()) home(); };
  window.scrollTo(0, 0);
}
function showErr(t) { $("err").innerHTML = `<div class="error">${esc(t)}</div>`; }
async function save(submit, quiet) {
  clearTimeout(P.timer);
  const c = P.cur, S = P.sheet;
  if (!quiet) $("err").innerHTML = "";
  const ss = $("ss"); if (ss) ss.textContent = "Saving…";
  const { error } = await sb.rpc("asmt_iv_save", { p_candidate: c.id, p_scores: S.scores, p_comments: S.comments,
    p_recommendation: S.rec, p_fee: S.fee, p_payment: S.pay, p_overall: S.overall, p_submit: !!submit });
  if (error) {
    const m = error.message || "";
    if (ss) ss.textContent = "Not saved";
    showErr(m.includes("already_submitted") ? "This scoresheet has already been submitted and is locked."
      : m.includes("score_every_category") ? "Score every category before submitting."
      : m.includes("choose_recommendation") ? "Choose an overall recommendation before submitting."
      : m.includes("not_a_panelist") ? "Your panel access has been switched off. Please contact RAHAMA."
      : "Not saved: check your internet connection and try again.");
    return false;
  }
  P.dirty = false;
  if (submit) { if (await load()) home(`Scores for ${c.full_name} submitted. Thank you.`); return true; }
  if (ss) ss.textContent = "Draft saved";
  return true;
}
window.addEventListener("beforeunload", e => { if (P.dirty) { e.preventDefault(); e.returnValue = ""; } });
start();
</script>
</body>
</html>
